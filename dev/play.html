<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
<body><script>addEventListener("error",e=>{document.title="ERR "+e.message});addEventListener("unhandledrejection",e=>{document.title="REJ "+(e.reason&&e.reason.stack||e.reason)})</script>
<script type=module>
// Dev page: the arena on its own, with a fake bridge. ?play=1 starts a match; ?t=<seconds> of simulated play before the shot.
import { createArena } from '../arena.js';
const q = new URLSearchParams(location.search);
let arena;
if (q.get('map')) localStorage.setItem('arena.map', JSON.stringify(q.get('map')));
localStorage.setItem('arena.agentOn', q.has('agent') ? 'true' : 'false');
// a fake company inventory: a finish to wear, starters to bring
const root0 = () => document;
const INVENTORY = [
  { id: 'finish-gold', kind: 'finish', rarity: 'legendary', color: '#d4a43a', accent: '#7a5a18', metal: true, name: 'Họa tiết Vàng ròng', desc: 'Súng mạ vàng bóng loáng.', games: ['arena'], count: 1 },
  { id: 'finish-neon', kind: 'finish', rarity: 'epic', color: '#1b1d24', accent: '#00e5ff', glow: true, name: 'Họa tiết Neon', desc: 'Thân đen, viền xanh phát sáng.', games: ['arena'], count: 1 },
  { id: 'armor-light', kind: 'starter', rarity: 'rare', name: 'Áo giáp nhẹ', desc: 'Vào trận với 50 giáp.', games: ['arena'], count: 2 },
  { id: 'pistol-start', kind: 'starter', rarity: 'epic', name: 'Súng lục giắt lưng', desc: 'Vào trận với một khẩu Orvel 9 và một băng đạn.', games: ['arena'], count: 1 },
];
const call = (name, ...a) => {
  console.log('call', name, ...a);
  if (name === 'arenaAgentTick') { const v = JSON.parse(a[0]); window.lastView = v; window.asks = (window.asks || 0) + 1; window.chars = (window.chars || 0) + a[0].length; setTimeout(() => arena.onMessage({ type: 'arena_agent', order: { type: 'zone' } }), 300); }
  if (name === 'arenaWallet') setTimeout(() => arena.onMessage({ type: 'arena_wallet', coins: 420, earned: 420, spent: 0, tokens: 420318, rate: 1000, owned: [], skin: '',
    equipped: { finish: q.get('finish') || 'finish-gold' }, inventory: INVENTORY }), 10);
  if (name === 'arenaStarter') setTimeout(() => arena.onMessage({ type: 'arena_starter', id: a[0], effect: { 'armor-light': { armor: 50 }, 'pistol-start': { weapon: 'orvel' }, 'medkit-1': { meds: { medkit: 1 } } }[a[0]] || {} }), 50);
};
arena = createArena({ call, agents: [{ slug: 'tro-ly', name: 'Trợ lý', title: 'Trợ lý CEO' }, { slug: 'dev-1', name: 'Minh', title: 'Lập trình viên' }], onExit: () => (document.title = 'exit') });
window.arena = arena;
await arena.open();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
await wait(800);
if (q.get('starter')) root0().querySelector(`[data-starter="${q.get('starter')}"]`)?.click();   // pick a starter in the lobby
if (q.has('play')) {
  await arena.debug().start();
  const d = arena.debug();
  d.look.pitch = +(q.get('pitch') || 0);
  if (q.get('w')) d.match.player.give(q.get('w'), 2);
  if (q.has('bot')) {   // stand a few metres from a bot, looking at it (to see its gear)
    const p = d.match.player, b = d.match.units.find((u) => !u.isPlayer && u.loadout && (u.loadout.vest || u.loadout.back));
    if (b) { const V = (await import('three')).Vector3; b.ai = null; b.wish = new V(); p.pos.copy(b.pos).add(new V(2.6, 0, 1.2)); p.pos.y = d.match.island.floorAt(p.pos.x, b.pos.y + 0.5, p.pos.z);
      d.look.yaw = Math.atan2(-(b.pos.x - p.pos.x), -(b.pos.z - p.pos.z)); d.look.pitch = -0.08; window.botGear = JSON.stringify(b.loadout); }
  }
  if (q.has('loot')) {   // walk to the nearest item, then open the loot panel
    const p = d.match.player, it = d.match.items.slice().sort((a, b) => a.pos.distanceTo(p.pos) - b.pos.distanceTo(p.pos))[0];
    p.pos.copy(it.pos).add(new (await import('three')).Vector3(1.2, 0, 0)); p.pos.y = d.match.island.floorAt(p.pos.x, it.pos.y + 0.5, p.pos.z);
    d.look.yaw = Math.PI / 2; d.look.pitch = -0.5;
    await wait(500);
    dispatchEvent(new KeyboardEvent('keydown', { code: 'Tab', key: 'Tab' }));
  }
  let frames = 0; const t0 = performance.now(); const tick = () => { frames++; if (performance.now() - t0 < 1e9) requestAnimationFrame(tick); }; requestAnimationFrame(tick);
  await wait((+(q.get('t') || 3)) * 1000);
  const p = d.match.player;
  const info = document.createElement('pre'); info.id = 'info'; info.style.display = 'none';
  info.textContent = `armed ${d.match.units.filter((u) => u.alive && u.slots.some(Boolean)).length}/${d.match.alive} kills ${d.match.units.reduce((n, u) => n + u.kills, 0)} asks ${window.asks} avgChars ${Math.round(window.chars / window.asks)} view ${JSON.stringify(window.lastView)} feed ${[...document.querySelectorAll('.ar-feedline')].map((x) => x.textContent).join(' | ')} fps ${(frames / ((performance.now() - t0) / 1000)).toFixed(1)} calls ${0} pos ${p.pos.toArray().map((v) => v.toFixed(1))} alive ${d.match.alive} items ${d.match.items.length}`;
  document.body.append(info);
}
document.title = 'done';
</script>
