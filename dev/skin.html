<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
<body><script>addEventListener("error",e=>{document.title="ERR "+e.message});addEventListener("unhandledrejection",e=>{document.title="REJ "+(e.reason&&e.reason.stack||e.reason)})</script>
<script type=module>
// Dev page: a skin seen up close, from its left side at shoulder height. ?s=Military_Male_01
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadAvatar, makeBody } from '../actors.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x30363e);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const a = await loadAvatar(`/addons/arena/skins/${q.get('s') || 'Military_Male_01'}.glb?${Date.now()}`);
const b = makeBody(a); s.add(b.group);
const c = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 20);
c.position.set(+(q.get("side") || 1) * 1.6, 1.45, 0.25); c.lookAt(0, 1.3, 0);   // the body faces +z; its left arm is on +x
r.render(s, c); document.title = 'done';
</script>
